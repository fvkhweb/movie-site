name: Update movies

on:
  schedule:
    # GitHub не соблюдает время scheduled-запусков: с 24 ноября прогоны
    # приходят с задержкой 9–11 часов (cron 06:00 → фактический старт 17:00 UTC),
    # а иногда не приходят вовсе. Поэтому запусков несколько за сутки, а
    # импорт выполняет только тот, что первым увидит устаревшие данные
    # (шаг «Проверить, обновлялись ли данные сегодня»), остальные выходят
    # за полминуты. Так данные обновляются в любом случае, независимо от
    # того, в какой час GitHub решит отдать запуск.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      audit_limit:
        description: "Сколько карточек КП перепроверить и исправить (0 — не аудитить)"
        required: false
        default: "0"

permissions:
  contents: write

# Два прогона одновременно конфликтуют на push — данные за день теряются
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить, обновлялись ли данные сегодня
        id: fresh
        run: |
          last=$(git log -1 --format=%cs -- data/movies.json)
          today=$(date -u +%F)
          echo "последнее обновление данных: $last, сегодня: $today"
          if [ "$last" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Restore KP import state
        uses: actions/cache@v4
        with:
          # kp_state.json — состояние импорта КП (что уже пробовали и почему
          # пропустили). Ключ уникален на прогон, restore-keys берёт последний:
          # файл меняется каждый запуск, поэтому фиксированный ключ не годится.
          path: data/kp_state.json
          key: kp-state-${{ github.run_number }}
          restore-keys: |
            kp-state-
      # Ручной запуск всегда полный (нужен для аудита), а страховочный
      # scheduled-прогон не трогает API, если ночной уже всё обновил.
      - name: Импорт новинок
        if: github.event_name != 'schedule' || steps.fresh.outputs.skip != 'true'
        run: python scripts/fetch_movies.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          POISKKINO_API_KEY: ${{ secrets.POISKKINO_API_KEY }}
          KP_UNOFFICIAL_API_KEY: ${{ secrets.KP_UNOFFICIAL_API_KEY }}
          KP_AUDIT_LIMIT: ${{ inputs.audit_limit || '0' }}
      - run: python scripts/bump_assets.py
      - run: python scripts/validate.py
      - run: python scripts/generate_pages.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/cast.json data/collections.json data/genres.json data/lists.json \
                  data/movies.json data/people.json posters/ film/ sitemap.xml index.html app.js
          git commit -m "update movies" || exit 0
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push; then
              exit 0
            fi
            echo "push не прошёл (попытка $attempt), повтор через 5 с"
            sleep 5
          done
          exit 1
