name: Update movies

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      import_limit:
        description: "Сколько новых фильмов Кинопоиска импортировать (0 — не импортировать)"
        required: false
        default: "0"
      import_source:
        description: "Источник импорта"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - dev
          - unofficial

permissions:
  contents: write

# Два прогона одновременно конфликтуют на push — данные за день теряются
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_movies.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          POISKKINO_API_KEY: ${{ secrets.POISKKINO_API_KEY }}
          KP_UNOFFICIAL_API_KEY: ${{ secrets.KP_UNOFFICIAL_API_KEY }}
          KP_IMPORT_LIMIT: ${{ inputs.import_limit || '0' }}
          KP_IMPORT_SOURCE: ${{ inputs.import_source || 'auto' }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ posters/
          git commit -m "update movies" || exit 0
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push; then
              exit 0
            fi
            echo "push не прошёл (попытка $attempt), повтор через 5 с"
            sleep 5
          done
          exit 1
