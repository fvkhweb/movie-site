name: Cache check

# Временная проверка: состояние КП должно восстанавливаться из actions/cache
# без запуска fetch_movies.py и без расхода ключей API.

on:
  push:
    paths:
      - .github/workflows/cache-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore KP import state
        uses: actions/cache@v4
        with:
          path: data/kp_state.json
          key: cache-check-${{ github.run_number }}
          restore-keys: |
            kp-state-
      - name: Verify restored file
        run: |
          test -s data/kp_state.json
          bytes=$(wc -c < data/kp_state.json)
          echo "kp_state bytes: $bytes"
          echo "### КП: восстановлено $bytes байт" >> "$GITHUB_STEP_SUMMARY"
