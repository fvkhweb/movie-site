<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Что посмотреть?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎬 Что посмотреть?</h1>
  
  <div class="top-controls">
    <div class="tabs">
      <button id="tab-popular" class="active" onclick="switchTab('popular')">Популярное</button>
      <button id="tab-top" onclick="switchTab('top_rated')">Топ по рейтингу</button>
    </div>
    
    <div class="filters">
      <input id="search" type="text" placeholder="Поиск по названию...">
      <select id="sortSelect">
        <option value="default">По умолчанию</option>
        <option value="rating_desc">Рейтинг (высокий → низкий)</option>
        <option value="year_desc">Год (новые → старые)</option>
        <option value="title_asc">Название (А → Я)</option>
      </select>
    </div>
  </div>

  <div id="grid" class="grid"></div>

  <div id="movieModal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
